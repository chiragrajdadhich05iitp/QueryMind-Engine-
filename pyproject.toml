[project]
name = "querymind-ai"
version = "0.1.0"
description = "Natural language to SQL query engine powered by Google Gemini and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=1.0.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"